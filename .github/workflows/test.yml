name: Test

# Runs on every push/PR AND is called by the release workflow as a gate, so a
# broken commit can never ship installers.
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_call:
    inputs:
      # The release workflow passes the tag it is about to build, so the gate
      # tests exactly the commit that ships. Defaults to the caller's SHA for
      # ordinary push and pull_request runs.
      ref:
        description: Git ref to check out and test
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Version files are in sync
        run: node scripts/sync-version.mjs --check

      - name: Backend install
        working-directory: backend
        run: npm ci --no-audit --no-fund

      # Type checking runs BEFORE the tests: it is fast, and a type error is a
      # clearer failure than whatever the tests would report downstream of it.
      # Without this step the opt-in `// @ts-check` coverage rots the first time
      # someone edits a checked file.
      - name: Backend typecheck
        working-directory: backend
        run: npm run typecheck

      # A bounded step: a hang here previously ran until the runner gave up,
      # producing no output and no signal about which test was stuck.
      - name: Backend tests
        working-directory: backend
        timeout-minutes: 15
        run: npm test

      # The Electron shell has no test runner of its own, and updatePolicy.js is
      # dependency-free by design, so node --test can run it directly. Without
      # this step the update rules (including the one that keeps Go Dark from
      # being bypassed) would have tests that nothing ever executes.
      # An explicit glob, not `node --test desktop/`: handed a directory, the
      # runner executes every file in it, so it would try to run main.js and
      # die on the first Electron API call.
      - name: Desktop tests
        run: node --test desktop/*.test.js

      - name: Frontend install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      # exhaustive-deps is a warning today, so this gates on errors only: an
      # actual rules-of-hooks violation or an undefined variable.
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      # Unit tests for the framework-free modules. Cheap, and this is the layer
      # where the recent defects actually lived.
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Frontend production build
        working-directory: frontend
        run: npx next build

  # The one-command setup, on every platform we claim to support.
  #
  # "node run.js and it works" is a promise about a machine that has none of
  # this installed yet, and it was only ever proven on macOS: the provider
  # binaries were installed under `if (process.platform === 'darwin')` and every
  # other platform got a warning, followed at runtime by "Run: node run.js
  # install" - a command that on Linux and Windows would never install them.
  #
  # This job is a genuinely cold machine: a fresh checkout, no node_modules, no
  # binaries. Ollama and the image service are skipped because they are large
  # downloads that prove nothing about the launcher; everything else is real.
  launcher:
    strategy:
      fail-fast: false      # one platform failing must not hide the others
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: One command, cold machine
        run: node run.js install --no-image --no-ollama

      # An installed binary that cannot start is worse than one that is absent,
      # and this is exactly what the old macOS-only code would have produced on
      # the current upstream layout: it moved the executable and left its shared
      # libraries behind. Run them.
      - name: The provider binaries actually execute
        run: node scripts/verify-providers.mjs

      - name: Doctor reports a healthy install
        run: node run.js doctor

  # Dependency advisories. Fast, and needs no installs: --package-lock-only
  # audits the lockfile directly, which also keeps the desktop tree auditable
  # without pulling down an Electron binary.
  #
  # The gate is on what SHIPS. Production trees fail the build at high; dev
  # trees are reported and do not, because they are build and test tooling that
  # never reaches a user and is often only fixable by a major bump of the
  # toolchain. The desktop dev tree is the live example: every advisory there is
  # electron or electron-builder, neither of which runs on a user's machine as
  # a library.
  #
  # NOTE: this does NOT cover the Electron runtime that electron-builder bundles
  # into the installer. That is a shipped Chromium, and npm audit says nothing
  # about it. Track the Electron major separately.
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend production dependencies
        working-directory: backend
        run: npm audit --package-lock-only --omit=dev --audit-level=high

      - name: Frontend production dependencies
        working-directory: frontend
        run: npm audit --package-lock-only --omit=dev --audit-level=high

      - name: Desktop production dependencies
        working-directory: desktop
        run: npm audit --package-lock-only --omit=dev --audit-level=high

      # Visible, not blocking.
      - name: Development toolchain (report only)
        if: always()
        run: |
          for dir in backend frontend desktop; do
            echo "== $dir =="
            (cd "$dir" && npm audit --package-lock-only) || true
          done

  # End-to-end against the real backend and a real browser. Kept as its own job
  # so a UI regression is distinguishable at a glance from a unit failure, and so
  # it can fail without hiding the faster signal above.
  e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund --prefix backend
          npm ci --no-audit --no-fund --prefix frontend

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # playwright.config.mjs boots the backend and the Next dev server itself.
      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          MIRABILIS_DATA_DIR: ${{ runner.temp }}/mirabilis-e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
